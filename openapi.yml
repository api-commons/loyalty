      operationId: listRewards
      summary: List rewards
      tags:
      - Rewards
      x-commons-tier: core
      x-commons-share: 0.727
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id002
                  $ref: '#/components/schemas/Reward'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createReward
      summary: Create a reward
      tags:
      - Rewards
      x-commons-tier: core
