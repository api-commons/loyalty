      operationId: getReward
      summary: Get a reward
      tags:
      - Rewards
      x-commons-tier: core
      x-commons-share: 0.727
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
    delete:
      operationId: deleteReward
      summary: Delete a reward
      tags:
      - Rewards
      x-commons-tier: extended
      x-commons-share: 0.273
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
    patch:
      operationId: updateReward
      summary: Update a reward
      tags:
